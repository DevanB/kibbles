# Separate Docker project from kibbles. On the NAS:
#   cd /volume1/docker/kibbles/deploy/watchtower
#   docker compose up -d
#
# Image: nickfedor/watchtower (maintained fork of archived containrrr/watchtower).
# LABEL_ENABLE keeps this process from touching unlabeled containers (cloudflared
# is unlabeled). App and queue share one image; only app runs migrations on boot.
name: watchtower

services:
  watchtower:
    image: nickfedor/watchtower:1.22.3
    restart: unless-stopped
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_POLL_INTERVAL: "180"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

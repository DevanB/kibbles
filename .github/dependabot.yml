version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 1
      semver-major-days: 1
      semver-minor-days: 1
      semver-patch-days: 1
    # Temporary until Wayfinder accepts HTTP QUERY (laravel/wayfinder#324).
    ignore:
      - dependency-name: "laravel/framework"
        versions: [">=13.35"]
    groups:
      composer-minor:
        patterns: ["*"]
        update-types: ["minor"]
      composer-patch:
        patterns: ["*"]
        update-types: ["patch"]
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 1
      semver-major-days: 1
      semver-minor-days: 1
      semver-patch-days: 1
    groups:
      bun-minor:
        patterns: ["*"]
        update-types: ["minor"]
      bun-patch:
        patterns: ["*"]
        update-types: ["patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 1
      semver-major-days: 1
      semver-minor-days: 1
      semver-patch-days: 1
    groups:
      github-actions-minor:
        patterns: ["*"]
        update-types: ["minor"]
      github-actions-patch:
        patterns: ["*"]
        update-types: ["patch"]

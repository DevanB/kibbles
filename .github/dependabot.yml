version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      composer-minor:
        patterns: ["*"]
        update-types: ["minor"]
      composer-patch:
        patterns: ["*"]
        update-types: ["patch"]
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      bun-minor:
        patterns: ["*"]
        update-types: ["minor"]
      bun-patch:
        patterns: ["*"]
        update-types: ["patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions-minor:
        patterns: ["*"]
        update-types: ["minor"]
      github-actions-patch:
        patterns: ["*"]
        update-types: ["patch"]
